# The manifest. rhun reads it from ~/.config/rhun/extensions/OWNER/NAME/extension.ini; name and
# owner must equal the repository's (the release workflow and Install from GitHub check it).
# Every key: https://rhun.app/extensions/v1/ section 2.
name = rhun-search-panel
owner = mroeling
title = Find in Files
description = A Find in Files panel in the sidebar: literal or regular expression search, match case and whole word, files to include and exclude, and Find in Folder in the Explorer.
icon = icon.png
color = #d9803f
version = 0.1.0
protocol = 1
run.linux-x86_64 = bin/rhun-search-panel-linux-x86_64
run.macos-arm64 = bin/rhun-search-panel-macos-arm64
run.windows-x64 = bin/rhun-search-panel-windows-x64.exe
on = command

[commands]
focus = Focus Find in Files
search = Search Files
in_folder = Find in Folder

[keys]
# focus the form (the built-in Find in Files is ctrl+shift+f)
ctrl+alt+shift+f = focus

[menu.explorer]
# right-click a folder in the Explorer
in_folder.when = explorerResourceIsFolder

[views]
# the form beside Agents; the results open in a tab of their own (src/main.rs)
search.title = Find in Files
search.place = side
search.kind = form
search.open = yes

[needs]
# the files to search (find-files, search-text) and their text (for a regular expression)
project = read
